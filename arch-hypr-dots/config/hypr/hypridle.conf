# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  hypridle — idle management                                           ║
# ║  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/                ║
# ╚═══════════════════════════════════════════════════════════════════════╝
#
# Fixed from the previous config:
#   * `hyprctrl` was a typo for `hyprctl` (so DPMS never actually worked)
#   * `hyprctl dispatch dpms on` is old hyprlang dispatcher syntax; since
#     Hyprland 0.55 hyprctl dispatch takes a Lua expression.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep    = 2
}

# 5 min — dim the backlight.
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5.5 min — lock.
listener {
    timeout    = 330
    on-timeout = loginctl lock-session
}

# 6 min — screen off.
listener {
    timeout    = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min — suspend. Comment this block out on a desktop.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
