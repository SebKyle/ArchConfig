# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  hyprpaper — wallpaper daemon                                         ║
# ║  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/               ║
# ╚═══════════════════════════════════════════════════════════════════════╝
#
# hyprpaper's config format changed: the old `preload = <path>` +
# `wallpaper = <mon>,<path>` pair is gone, replaced by `wallpaper { }`
# blocks. Paths are no longer hardcoded to one user's home either.
#
# scripts/setwall.sh keeps ~/.config/hypr/current-wallpaper pointed at
# whatever you last picked, and pushes it live over IPC with
#   hyprctl hyprpaper wallpaper ", <path>, cover"
# so you rarely need to edit this file.

splash = false
ipc    = true

wallpaper {
    monitor  =
    path     = ~/.config/hypr/current-wallpaper
    fit_mode = cover
}
