# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  hyprlock — lock screen                                               ║
# ║  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/                ║
# ║  NOTE: hyprlock still uses hyprlang (.conf), not Lua. Only Hyprland   ║
# ║        itself moved to Lua in 0.55.                                   ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# Colours come from pywal. install.sh seeds this file with a fallback palette
# so hyprlock works before you have ever run `setwall`.
source = $HOME/.cache/wal/hyprlock-colors.conf

general {
    hide_cursor = true

    # ── The "press Enter, then type" behaviour ──────────────────────────
    # Pressing Enter on an empty field does nothing at all: no auth attempt,
    # no "authentication failed", and crucially no strike against
    # pam_faillock (Arch locks you out for 10 minutes after 3 failures).
    # Combined with fade_on_empty = false below, the password box is always
    # on screen, so you can press Enter to "wake" the screen and then type
    # into a field you can actually see, instead of typing blind.
    ignore_empty_input = true

    # Draw immediately instead of waiting for the wallpaper to decode --
    # stops the black flash when locking.
    immediate_render = true

    fail_timeout = 2000
}

auth {
    pam:enabled = true
    # Uncomment if you have fprintd set up:
    # fingerprint:enabled = true
}

animations {
    enabled = true
    bezier   = linear, 1, 1, 0, 0
    animation = fadeIn,  1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # setwall.sh keeps this symlink pointed at your current wallpaper, so the
    # lock screen always matches the desktop.
    path    = $HOME/.config/hypr/current-wallpaper
    color   = $color0

    blur_passes  = 3
    blur_size    = 6
    noise        = 0.0117
    contrast     = 1.1
    brightness   = 0.5
    vibrancy     = 0.21
    vibrancy_darkness = 0.0
}

# ── Clock ───────────────────────────────────────────────────────────────
label {
    monitor    = 
    text       = $TIME
    color      = $foreground
    font_size  = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position   = 0, -140
    halign     = center
    valign     = top

    shadow_passes = 3
    shadow_size   = 5
    shadow_color  = rgba(0, 0, 0, 0.6)
}

label {
    monitor     = 
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $color7
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    position    = 0, -270
    halign      = center
    valign      = top
}

# ── Avatar ──────────────────────────────────────────────────────────────
# Drop a square image at ~/.face to get a profile picture. If the file is
# missing hyprlock just draws nothing here.
image {
    monitor      = 
    path         = $HOME/.face
    size         = 110
    rounding     = -1
    border_size  = 3
    border_color = $color6
    position     = 0, 80
    halign       = center
    valign       = center
}

# ── Password field ──────────────────────────────────────────────────────
input-field {
    monitor         = 
    size            = 320, 56
    outline_thickness = 2
    dots_size       = 0.25
    dots_spacing    = 0.30
    dots_center     = true
    dots_rounding   = -1

    outer_color     = $color6
    inner_color     = $color0
    font_color      = $foreground
    font_family     = JetBrainsMono Nerd Font

    check_color     = $color4
    check_text      = <i>Checking…</i>
    fail_color      = $color1
    fail_text       = <i>$FAIL</i>
    capslock_color  = $color3

    # false = the field never fades away, so there is always a visible target
    # to type into. This is the other half of the Enter-then-type behaviour.
    # Set it to true if you would rather the box hide itself when idle.
    fade_on_empty   = false
    fade_timeout    = 2000

    placeholder_text = <i>Press Enter, then type…</i>
    hide_input      = false
    rounding        = 16

    position        = 0, -60
    halign          = center
    valign          = center

    shadow_passes   = 2
    shadow_size     = 4
    shadow_color    = rgba(0, 0, 0, 0.5)
}

# ── User ────────────────────────────────────────────────────────────────
label {
    monitor     = 
    text        = $USER
    color       = $color6
    font_size   = 16
    font_family = JetBrainsMono Nerd Font Bold
    position    = 0, -10
    halign      = center
    valign      = center
}

# ── Failed attempts ─────────────────────────────────────────────────────
label {
    monitor     = 
    text        = $ATTEMPTS[]
    color       = $color1
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    position    = 0, -130
    halign      = center
    valign      = center
}

# ── Battery / keyboard layout footer ────────────────────────────────────
label {
    monitor     = 
    text        = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh
    color       = $color7
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    position    = 0, 40
    halign      = center
    valign      = bottom
}
