# ╔══════════════════════════════════════════════════════════════════════╗
# ║  qt5ct — Qt5 platform theme                                          ║
# ║                                                                      ║
# ║  QT_QPA_PLATFORMTHEME=qt5ct (set in hypr/conf/env.lua) makes every    ║
# ║  Qt5 app -- Dolphin, Ark, Gwenview, Kate -- read this file, which in  ║
# ║  turn points at Kvantum for the actual widget style. That is the      ║
# ║  chain that makes Dolphin stop looking like raw Fusion.               ║
# ║                                                                      ║
# ║  Fonts are deliberately not set here: Qt stores them as binary        ║
# ║  QVariant blobs that are not safe to hand-write. Run `qt5ct` and set  ║
# ║  them in the GUI if the defaults do not suit you.                     ║
# ╚══════════════════════════════════════════════════════════════════════╝

[Appearance]
style=kvantum-dark
# custom_palette=false means "use the style's own palette", i.e. Kvantum's.
custom_palette=false
icon_theme=Papirus-Dark
standard_dialogs=default

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
