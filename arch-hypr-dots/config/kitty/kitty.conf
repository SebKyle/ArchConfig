# ╔══════════════════════════════════════════════════════════════════════╗
# ║  kitty — https://sw.kovidgoyal.net/kitty/conf/                       ║
# ║  Colours come from pywal. Reload after a wallpaper change with       ║
# ║  `kill -SIGUSR1 $(pidof kitty)` -- setwall.sh does this for you.     ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────────────────────────────
font_family      family="CaskaydiaCove Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

# ── Window ─────────────────────────────────────────────────────────────
window_padding_width   14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity      0.90
dynamic_background_opacity yes
remember_window_size    no
initial_window_width    110c
initial_window_height   30c

# ── Cursor ─────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.5
shell_integration     no-cursor

# ── Scrollback ─────────────────────────────────────────────────────────
scrollback_lines       10000
scrollback_pager_history_size 8

# ── Tabs ───────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# ── Bell ───────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.1

# ── Keys ───────────────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t    new_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0    change_font_size all 0

# ── Colours (pywal) ────────────────────────────────────────────────────
# install.sh seeds ~/.cache/wal/colors-kitty.conf with a fallback palette so
# this include never fails on a fresh system.
include ~/.cache/wal/colors-kitty.conf
