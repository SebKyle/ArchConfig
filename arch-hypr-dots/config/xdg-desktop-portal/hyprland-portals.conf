# Which portal backend handles what under Hyprland.
#
# hyprland handles screenshot/screencast (that is the whole point of
# xdg-desktop-portal-hyprland); gtk handles the file chooser and settings,
# because the GTK file picker is the one most apps expect. Without this file
# you get portal races where screen sharing silently picks the wrong backend.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
